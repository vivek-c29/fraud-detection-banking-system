name: CI/CD - Deploy Banking Backend

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:

  # BUILD AND PUSH ALL 6 MICROSERVICES

  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest

    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}

    steps:
      # 1. Checkout repository

      - name: Checkout repository
        uses: actions/checkout@v4


      # 2. Generate Git SHA tag

      - name: Generate image tag
        id: meta
        run: |
          IMAGE_TAG="${GITHUB_SHA::7}"
          echo "image_tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"
          echo "Using image tag: $IMAGE_TAG"


      # 3. Configure AWS using OIDC

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ secrets.AWS_REGION }}


      # 4. Login to Amazon ECR

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2


      # 5. Build & Push Account Service

      - name: Build and push account-service
        env:
          REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com
          IMAGE_TAG: ${{ steps.meta.outputs.image_tag }}
        run: |
          docker build \
            -t $REGISTRY/account-service:$IMAGE_TAG \
            ./account-service

          docker push \
            $REGISTRY/account-service:$IMAGE_TAG


      # 6. Build & Push Transaction Service

      - name: Build and push transaction-service
        env:
          REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com
          IMAGE_TAG: ${{ steps.meta.outputs.image_tag }}
        run: |
          docker build \
            -t $REGISTRY/transaction-service:$IMAGE_TAG \
            ./transaction-service

          docker push \
            $REGISTRY/transaction-service:$IMAGE_TAG


      # 7. Build & Push Fraud Detection Service

      - name: Build and push fraud-detection-service
        env:
          REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com
          IMAGE_TAG: ${{ steps.meta.outputs.image_tag }}
        run: |
          docker build \
            -t $REGISTRY/fraud-detection-service:$IMAGE_TAG \
            ./fraud-detection-service

          docker push \
            $REGISTRY/fraud-detection-service:$IMAGE_TAG


      # 8. Build & Push Payment Service

      - name: Build and push payment-service
        env:
          REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com
          IMAGE_TAG: ${{ steps.meta.outputs.image_tag }}
        run: |
          docker build \
            -t $REGISTRY/payment-service:$IMAGE_TAG \
            ./payment-service

          docker push \
            $REGISTRY/payment-service:$IMAGE_TAG


      # 9. Build & Push Notification Service

      - name: Build and push notification-service
        env:
          REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com
          IMAGE_TAG: ${{ steps.meta.outputs.image_tag }}
        run: |
          docker build \
            -t $REGISTRY/notification-service:$IMAGE_TAG \
            ./notification-service

          docker push \
            $REGISTRY/notification-service:$IMAGE_TAG


      # 10. Build & Push API Gateway

      - name: Build and push api-gateway
        env:
          REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com
          IMAGE_TAG: ${{ steps.meta.outputs.image_tag }}
        run: |
          docker build \
            -t $REGISTRY/api-gateway:$IMAGE_TAG \
            ./api-gateway

          docker push \
            $REGISTRY/api-gateway:$IMAGE_TAG


  # DEPLOY TO EC2

  deploy:
    name: Deploy to EC2
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:

      - name: Deploy application to EC2
        uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: IMAGE_TAG
          script: |

            # Move to application directory
            cd ~/app

            # Show deployment version
            echo "Deploying version: $IMAGE_TAG"


            # ------------------------------------------------
            # Authenticate Docker with ECR
            #
            # EC2 IAM Role provides AWS credentials.
            # No AWS access keys are stored in GitHub.
            # ------------------------------------------------

            aws ecr get-login-password \
              --region ap-south-1 | \
              docker login \
              --username AWS \
              --password-stdin \
              ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com


            # ------------------------------------------------
            # Pull the new application images
            # ------------------------------------------------

            IMAGE_TAG=$IMAGE_TAG docker compose pull \
              account-service \
              transaction-service \
              fraud-detection-service \
              payment-service \
              notification-service \
              api-gateway


            # ------------------------------------------------
            # Start/recreate only the application services
            # ------------------------------------------------

            IMAGE_TAG=$IMAGE_TAG docker compose up -d \
              account-service \
              transaction-service \
              fraud-detection-service \
              payment-service \
              notification-service \
              api-gateway


            # ------------------------------------------------
            # Remove dangling Docker images
            #
            # Safe cleanup:
            # removes unused intermediate/dangling images,
            # but does NOT remove running containers or volumes.
            # ------------------------------------------------

            docker image prune -f


            # ------------------------------------------------
            # Show running containers
            # ------------------------------------------------

            docker compose ps
