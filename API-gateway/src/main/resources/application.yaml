spring:
  application:
    name: api-gateway

  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}

  cloud:
    inetutils:
      preferred-networks: 127.0.0.1

    gateway:
      server:
        webflux:

          globalcors:
            add-to-simple-url-handler-mapping: true

            cors-configurations:
              '[/**]':
                allowedOrigins:
                  - ${FRONTEND_ORIGIN_URL:http://localhost:5173}

                allowedMethods:
                  - GET
                  - POST
                  - PUT
                  - OPTIONS

                allowedHeaders:
                  - "*"

          routes:

            - id: auth-service
              uri: http://auth-service:8086
              predicates:
                - Path=/api/v1/auth/**

            - id: account-service
              uri: http://account-service:8081
              predicates:
                - Path=/api/v1/accounts/**

            - id: transaction-service
              uri: http://transaction-service:8082
              predicates:
                - Path=/api/v1/transactions/**

            - id: payment-service
              uri: http://payment-service:8083
              predicates:
                - Path=/api/v1/payments/**


server:
  port: 8080


management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway